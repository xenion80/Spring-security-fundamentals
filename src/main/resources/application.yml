spring:
  application:
    name: SecurityApplication

  datasource:
    url: jdbc:mysql://localhost:3306/security_app?useSSL=false&allowPublicKeyRetrieval=true
    username: spring
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.MySQLDialect

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${CLIENT_ID}
            client-secret:  ${CLIENT_SECRET}


jwt:
  secretKey: ${JWT_SECRET}

deploy:
  env: development

logging:
  level:
    org.springframework.security: DEBUG